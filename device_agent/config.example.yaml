# 複製為 config.yaml。以下兩項為新版 Pi agent 唯一必要的遠端設定：
# - server_url：Docker 管理端的公開 HTTPS URL；不加 /api 或結尾斜線。
# - device_token：管理端建立／重配發時只顯示一次；不得放入 URL、log 或 Git。
# Pi agent 不保存 device_id、layout、LINE credential 或全域 API token。
server_url: https://epagerpi.example.com
device_token: replace-with-device-token

# 選用：版面資料輪詢與本機 e-paper 合成頻率（秒）。
# poll 最小為 5 秒，tick 最小為 0.5 秒；一般不建議調低，以保護電子紙面板。
poll_interval_seconds: 30
tick_seconds: 1

# ---- UPS 電量看門狗 ----
ups:
  enabled: true
  i2c_address: 0x43
  poll_interval_seconds: 30
  shutdown_threshold_percent: 35
  shutdown_confirm_reads: 3
