<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>epagerPi 管理台</title><link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar"><h1>epagerPi 管理台</h1><span id="identity"></span><button id="logout">登出</button></header>
<main class="workspace">
  <section class="card">
    <h2>Pi 設定</h2>
    <form id="device-form" class="form-row"><input id="device-name" required maxlength="100" placeholder="Pi 名稱">
      <select id="device-model"><option value="waveshare_4in26">Waveshare 4.26 吋</option><option value="inky_phat">Pimoroni Inky pHAT</option><option value="mock">Mock</option></select>
      <button>新增 Pi 並配發 token</button></form>
    <p class="hint">Token 僅會在建立或重配發時顯示一次；隱藏的 Pi 無法讀取版面。</p><div id="device-list"></div>
  </section>

  <section class="card">
    <h2>頁面建立器</h2>
    <div class="form-row"><input id="new-page-name" maxlength="100" placeholder="新頁面名稱"><button id="new-page">新增頁面</button>
      <select id="page-select"></select><button id="save-page">儲存頁面</button></div>
    <div class="builder"><div><h3>元件</h3><select id="module-select"></select><button id="add-module">加入元件</button><div id="element-list"></div></div>
      <form id="element-form" hidden><h3>元件屬性</h3><div class="grid-fields">
        <label>x<input id="el-x" type="number" min="0"></label><label>y<input id="el-y" type="number" min="0"></label>
        <label>寬<input id="el-w" type="number" min="1"></label><label>高<input id="el-h" type="number" min="1"></label>
        <label>層級<input id="el-z" type="number"></label><label>刷新秒數<input id="el-refresh" type="number" min="1"></label></div>
        <div id="config-fields"></div><button>套用元件</button><button id="remove-element" type="button" class="danger">刪除元件</button></form></div>
    <p class="hint">頁面、元件與模組設定皆以欄位操作，管理畫面不提供 JSON 編輯。</p>
  </section>

  <section class="card"><h2>規則建立器</h2>
    <form id="rule-form" class="grid-fields"><label>規則名稱<input id="rule-name" required maxlength="100"></label><label>Pi<select id="rule-device"></select></label>
      <label>頁面<select id="rule-page"></select></label><label>優先序<input id="rule-priority" type="number" value="0"></label>
      <label>開始時間<input id="rule-start" type="time"></label><label>結束時間<input id="rule-end" type="time"></label>
      <label>出勤狀態<select id="rule-attendance"><option value="">不限</option><option value="pending">未打卡</option><option value="working">上班中</option><option value="off_work">已下班</option><option value="leave">請假</option></select></label>
      <label>假日<select id="rule-holiday"><option value="">不限</option><option value="true">是</option><option value="false">否</option></select></label>
      <fieldset id="weekdays"><legend>星期</legend><label><input type="checkbox" value="0">一</label><label><input type="checkbox" value="1">二</label><label><input type="checkbox" value="2">三</label><label><input type="checkbox" value="3">四</label><label><input type="checkbox" value="4">五</label><label><input type="checkbox" value="5">六</label><label><input type="checkbox" value="6">日</label></fieldset><button>新增規則</button></form><div id="rule-list"></div>
  </section>

  <section class="card"><h2>素材與出勤</h2><form id="asset-form"><input id="asset-file" type="file" accept="image/png,image/jpeg,image/gif,image/bmp,image/webp" required><button>上傳圖片</button></form><div id="asset-list"></div>
    <form id="attendance-form" class="form-row"><label>上班<input id="clock-in" type="time"></label><label>下班<input id="clock-out" type="time"></label><label><input id="on-leave" type="checkbox"> 請假</label><input id="leave-note" maxlength="80" placeholder="請假說明"><button>儲存出勤</button></form><p id="attendance-status" class="hint"></p></section>
</main><script src="editor.js"></script></body></html>
