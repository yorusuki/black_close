services:
  epagerpi:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: epagerpi-server:latest
    restart: unless-stopped
    environment:
      EPAGERPI_AUTH_ENABLED: "1"
      EPAGERPI_AUTH_MODE: ${EPAGERPI_AUTH_MODE:-legacy}
      EPAGERPI_AUTH_USER: ${EPAGERPI_AUTH_USER:-admin}
      EPAGERPI_AUTH_PASS: ${EPAGERPI_AUTH_PASS:-}
      EPAGERPI_API_TOKEN: ${EPAGERPI_API_TOKEN:-}
      EPAGERPI_LEGACY_API_COMPAT: ${EPAGERPI_LEGACY_API_COMPAT:-1}
      EPAGERPI_DATABASE_URL: ${EPAGERPI_DATABASE_URL:-/app/data/epagerpi.sqlite3}
      EPAGERPI_DEVICE_TOKEN_PEPPER: ${EPAGERPI_DEVICE_TOKEN_PEPPER:-}
      EPAGERPI_LINE_CHANNEL_ID: ${EPAGERPI_LINE_CHANNEL_ID:-}
      EPAGERPI_LINE_CHANNEL_SECRET: ${EPAGERPI_LINE_CHANNEL_SECRET:-}
      EPAGERPI_LINE_REDIRECT_URI: ${EPAGERPI_LINE_REDIRECT_URI:-}
      EPAGERPI_LINE_CALLBACK_PATH: ${EPAGERPI_LINE_CALLBACK_PATH:-/auth/line/callback}
      EPAGERPI_SESSION_SECRET: ${EPAGERPI_SESSION_SECRET:-}
      EPAGERPI_REGISTRATION_MODE: ${EPAGERPI_REGISTRATION_MODE:-closed}
      EPAGERPI_SESSION_COOKIE_SECURE: ${EPAGERPI_SESSION_COOKIE_SECURE:-1}
      EPAGERPI_FONT_PATH: ${EPAGERPI_FONT_PATH:-}
      EPAGERPI_TIMEZONE: ${EPAGERPI_TIMEZONE:-Asia/Taipei}
    volumes:
      - ../data:/app/data
    # 不發布 host port：cloudflared 容器透過同一個 Docker network
    # 以 http://epagerpi:8080 存取此服務。
    expose:
      - "8080"
    networks: [cloudflared]

  attendance-sync:
    image: epagerpi-server:latest
    restart: unless-stopped
    init: true
    shm_size: "1gb"
    command: ["python", "-m", "server.attendance_sync"]
    environment:
      EPAGERPI_DATA_DIR: /app/data
      EPAGERPI_TIMEZONE: ${EPAGERPI_TIMEZONE:-Asia/Taipei}
      EIP_LOGIN_URL: ${EIP_LOGIN_URL:?請先在 docker/.env 設定 EIP 登入網址}
      USER_NAME: ${USER_NAME:?請先在 docker/.env 設定姓名}
      LOGIN_USERNAME: ${LOGIN_USERNAME:?請先在 docker/.env 設定登入帳號}
      LOGIN_PASSWORD: ${LOGIN_PASSWORD:?請先在 docker/.env 設定登入密碼}
    volumes:
      - ../data:/app/data
    depends_on:
      epagerpi:
        condition: service_started
    networks: [cloudflared]

networks:
  cloudflared:
    external: true
    name: cloudflared
